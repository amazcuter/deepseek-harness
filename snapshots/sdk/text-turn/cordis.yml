# TypeScript SDK snapshot-record patch over `mwf --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@metaworkflow/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@metaworkflow/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: !!js "process.env.MWF_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@metaworkflow/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- insert:
    - id: snapshot-message-feedback
      name: '@metaworkflow/message-feedback'
      disabled: !!js "process.env.MWF_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.MWF_SNAPSHOT_FEEDBACK !== '1'"
