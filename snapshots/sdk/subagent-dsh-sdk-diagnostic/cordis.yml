# TypeScript SDK snapshot patch for automatic MWF SDK failure notices.

- id: skill-filesystem
  name: '@metaworkflow/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@metaworkflow/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: !!js "process.env.MWF_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-deepseek
  name: '@metaworkflow/session-log-deepseek'
  config:
    enabled: true

- insert:
    - id: subagent-dsh-sdk-diagnostic
      name: '@metaworkflow/subagent-dsh-sdk'
      config:
        providerName: mwf-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.MWF_TEST_CHILD_PATCH
        mwfHome: !!js mwfHomePath('children/first')
        provider: mock
        model: mock-echo
        env:
          MWF_TELEMETRY_DISABLED: '1'
          MWF_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-dsh-sdk-diagnostic
      name: '@metaworkflow/tool-subagent'
      config:
        provider: mwf-sdk-diagnostic
        toolName: subagent_mwf_sdk
        maxDepth: provider-managed
    - id: subagent-mwf-sdk-diagnostic-second
      name: '@metaworkflow/subagent-dsh-sdk'
      config:
        providerName: mwf-sdk-diagnostic-second
        profile: sdk
        patches:
          - !!js process.env.MWF_TEST_CHILD_PATCH
        mwfHome: !!js mwfHomePath('children/second')
        provider: mock
        model: mock-echo
        env:
          MWF_TELEMETRY_DISABLED: '1'
          MWF_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-mwf-sdk-diagnostic-second
      name: '@metaworkflow/tool-subagent'
      config:
        provider: mwf-sdk-diagnostic-second
        toolName: subagent_mwf_sdk_second
        maxDepth: provider-managed
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
