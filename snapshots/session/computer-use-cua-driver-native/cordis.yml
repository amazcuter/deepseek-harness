- id: agent-default-model
  name: '@metaworkflow/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@metaworkflow/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@metaworkflow/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@metaworkflow/attachment-local'

- insert:
    - id: computer-use
      name: '@metaworkflow/computer-use'
    - id: native-computer-use-fixture
      name: './native-fixture.mjs'
