# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@metaworkflow/llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: none

- id: sandbox
  name: '@metaworkflow/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@metaworkflow/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: spill-local
  name: '@metaworkflow/spill-local'
  config:
    root: !!js process.env.MWF_SNAPSHOT_SPILL_ROOT ?? './.spill'
    cleanupPeriodDays: 0

- insert:
    - id: session-reference
      name: '@metaworkflow/session-reference'
      config:
        maxReferenceBytes: 360
    - id: reference-source-fixture
      name: ../../../packages/context/session-reference/tests/fixtures/source-session.ts

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.MWF_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.MWF_SNAPSHOT_SPILL_LOCATOR_ROOT
