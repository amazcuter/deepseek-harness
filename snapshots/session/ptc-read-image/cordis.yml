# PTC mode image overlay: mounts the worker runtime and durable attachment
# store so a nested read_image result can cross the generic rich-result bridge.
# The live config selects the shipped vision route for manual use.
- id: agent-default-model
  name: '@metaworkflow/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: !!js 'process.env.MWF_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@metaworkflow/agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@metaworkflow/tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@metaworkflow/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: attachment-local
  name: '@metaworkflow/attachment-local'
