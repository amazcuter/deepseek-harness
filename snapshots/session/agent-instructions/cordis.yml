# Workspace-context snapshot patch: the harness exports MWF_HOME=<cwd>/.mwf and
# MWF_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@metaworkflow/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: !!js 'process.env.MWF_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@metaworkflow/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .mwf-project

- id: system-prompt
  name: '@metaworkflow/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
