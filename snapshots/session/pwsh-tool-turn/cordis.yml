# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@metaworkflow/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@metaworkflow/subprocess-local'

- id: bash-sandbox
  name: '@metaworkflow/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@metaworkflow/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@metaworkflow/shell-env'

- id: agent-default-model
  name: '@metaworkflow/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: !!js 'process.env.MWF_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@metaworkflow/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@metaworkflow/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@metaworkflow/goal'
  disabled: true

- id: goal-round-driver
  name: '@metaworkflow/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@metaworkflow/command-goal'
  disabled: true

- id: tool-goal
  name: '@metaworkflow/tool-goal'
  disabled: true

- id: skill
  name: '@metaworkflow/skill'
  disabled: true

- id: skill-filesystem
  name: '@metaworkflow/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@metaworkflow/tool-skill'
  disabled: true

- id: tool-bash
  name: '@metaworkflow/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@metaworkflow/tool-pwsh'
  disabled: false
