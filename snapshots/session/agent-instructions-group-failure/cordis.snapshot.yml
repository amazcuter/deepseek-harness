# Keyless replay runs the authored three-request model script.
- id: llm-deepseek
  name: '@metaworkflow/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@metaworkflow/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@metaworkflow/session-persistence-jsonl'
  config:
    root: !!js mwfHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@metaworkflow/agent-instructions'
  config:
    maxBytes: 65536
    projectRootMarkers:
      - .mwf-project

- id: system-prompt
  name: '@metaworkflow/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@metaworkflow/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: workspace-context-global-failure
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/workspace-context-global-failure.ts'
