- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@metaworkflow/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.MWF_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: mwf-telemetry-test
        serviceVersion: !!js process.env.MWF_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 60000
