# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@metaworkflow/system-prompt'

- id: fs
  name: '@metaworkflow/fs-local'

- id: session-projections
  name: '@metaworkflow/session-projection'

- id: working-directory
  name: '@metaworkflow/working-directory'

- id: tools
  name: '@metaworkflow/tools'

- id: subprocess
  name: '@metaworkflow/subprocess-local'

- id: bash
  name: '@metaworkflow/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@metaworkflow/shell-env'

- id: tasks
  name: '@metaworkflow/jobs-local'

- id: tool-jobs
  name: '@metaworkflow/tool-jobs'

- id: tool-pwsh
  name: '@metaworkflow/tool-pwsh'
