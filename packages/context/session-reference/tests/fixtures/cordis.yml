- name: '@metaworkflow/session'
- name: '@metaworkflow/system-prompt'
- name: '@metaworkflow/tools'
- name: '@metaworkflow/fs-local'
- name: '@metaworkflow/session-projection'
- name: '@metaworkflow/working-directory'
- name: '@metaworkflow/tool-fs'
- name: '@metaworkflow/session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never
- name: '@metaworkflow/session-reference'
  config:
    maxReferenceBytes: 360
- name: './source-session.ts'
- name: '@metaworkflow/spill-local'
  config:
    root: '{{spillRoot}}'
    cleanupPeriodDays: 0
