- name: '@metaworkflow/llm'
- name: '@metaworkflow/session'
- name: '@metaworkflow/session-projection'
- name: '@metaworkflow/system-prompt'
- name: '@metaworkflow/tools'
- name: '@metaworkflow/agent'
- name: '@metaworkflow/agent-loop'
  config:
    agents: []
- name: '@metaworkflow/credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@metaworkflow/llm-deepseek-api-key'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
- name: '@metaworkflow/llm-deepseek-account'
  config:
    baseURL: {{endpoint}}
