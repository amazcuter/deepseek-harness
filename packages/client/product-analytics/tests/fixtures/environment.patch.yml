- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@metaworkflow/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.MWF_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: mwf-environment-test
        serviceVersion: synthetic-release
        compression: none
    - id: product-analytics
      name: '@metaworkflow/client-product-analytics'
      config:
        enabled: true
        appVersion: synthetic-release
